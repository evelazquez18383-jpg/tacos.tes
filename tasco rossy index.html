<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tacos Rossy | Punto de venta</title>
  <style>
    :root { --red:#b52c28; --yellow:#f5bf28; --cream:#fff8ea; --ink:#20201d; --muted:#77736a; --line:#e9e1d2; --green:#33774d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f3eadb; color:var(--ink); }
    header { height:76px; background:var(--red); color:white; display:flex; align-items:center; justify-content:space-between; padding:0 34px; box-shadow:0 2px 8px #68201d40; }
    .brand { display:flex; gap:12px; align-items:center; font-weight:800; letter-spacing:.3px; font-size:20px; }
    .mark { width:42px; height:42px; border-radius:50%; background:var(--yellow); color:var(--red); display:grid; place-items:center; font-size:25px; border:3px solid #fff2c8; }
    .shift { font-size:14px; display:flex; align-items:center; gap:9px; opacity:.95; } .online { width:9px; height:9px; border-radius:50%; background:#78e097; }
    main { display:grid; grid-template-columns:minmax(0,1fr) 375px; gap:22px; padding:26px 32px; max-width:1500px; margin:auto; }
    .catalog { min-width:0; }
    .topline { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    h1 { margin:0; font-size:27px; } .today { color:var(--muted); font-size:14px; }
    .sale-data { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
    .field { background:#fffdf8; border:1px solid var(--line); border-radius:12px; padding:8px 11px; }
    .field label { display:block; color:var(--muted); font-size:11px; font-weight:750; letter-spacing:.4px; text-transform:uppercase; margin-bottom:3px; }
    .field input { border:0; outline:0; padding:2px 0; width:100%; background:transparent; color:var(--ink); font:inherit; font-weight:700; }
    .categories { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
    .category { border:1px solid var(--line); background:#fffdf8; padding:9px 15px; border-radius:24px; cursor:pointer; font-weight:650; color:#5e5b55; }
    .category.active, .category:hover { border-color:var(--red); background:var(--red); color:white; }
    .products { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:15px; }
    .product { appearance:none; text-align:left; border:1px solid var(--line); background:var(--cream); border-radius:16px; overflow:hidden; cursor:pointer; padding:0; transition:.18s transform,.18s box-shadow; }
    .product:hover { transform:translateY(-3px); box-shadow:0 10px 22px #462a191c; } .product:active { transform:translateY(0); }
    .product-image { height:112px; display:grid; place-items:center; font-size:58px; background:linear-gradient(145deg,#ffd969,#eb9d22); }
    .product:nth-child(2n) .product-image { background:linear-gradient(145deg,#f7b47c,#d76436); } .product:nth-child(3n) .product-image { background:linear-gradient(145deg,#9bcf85,#498e5b); }
    .product-info { padding:13px; } .product-name { font-weight:750; font-size:15px; display:block; } .price { margin-top:5px; font-size:16px; color:var(--red); font-weight:800; }
    .order { background:#fffdf9; border-radius:20px; padding:21px; box-shadow:0 3px 15px #4d32101c; min-height:calc(100vh - 128px); display:flex; flex-direction:column; }
    .order-head { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding-bottom:15px; } h2 { font-size:20px; margin:0; } .new-order { border:0; background:#f8e6df; color:var(--red); padding:8px 10px; border-radius:9px; font-weight:700; cursor:pointer; }
    #cart { flex:1; padding:10px 0; } .empty { color:#999388; text-align:center; margin-top:70px; line-height:1.6; } .empty strong { display:block; color:#6e6960; font-size:17px; }
    .item { padding:12px 0; border-bottom:1px solid #f0eadf; display:grid; grid-template-columns:1fr auto; gap:8px; } .item-name { font-weight:700; font-size:14px; } .item-price { color:var(--red); font-weight:800; font-size:14px; }
    .quantity { display:flex; align-items:center; gap:8px; margin-top:8px; } .quantity button { border:1px solid var(--line); width:25px; height:25px; border-radius:7px; background:white; cursor:pointer; font-size:17px; line-height:1; } .quantity span { min-width:14px; text-align:center; font-weight:700; }
    .summary { border-top:1px solid var(--line); padding-top:15px; } .row { display:flex; justify-content:space-between; margin:7px 0; color:#68645d; font-size:14px; } .total { color:var(--ink); font-size:21px; font-weight:850; padding-top:7px; } .total span:last-child { color:var(--red); }
    .pay { width:100%; border:0; background:var(--green); color:white; border-radius:11px; margin-top:16px; padding:15px; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 4px 0 #24583a; } .pay:hover { background:#286440; }
    .pay:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }
    .modal { position:fixed; inset:0; display:none; background:#1e19156b; align-items:center; justify-content:center; padding:20px; } .modal.open { display:flex; } .dialog { background:white; width:min(430px,100%); border-radius:20px; padding:26px; text-align:center; box-shadow:0 20px 50px #120c0980; } .dialog .check { width:62px; height:62px; margin:0 auto 12px; border-radius:50%; display:grid; place-items:center; background:#dbf2df; color:var(--green); font-size:31px; } .dialog p { color:var(--muted); } .payment-options { display:flex; gap:8px; margin:18px 0; } .payment-options button { flex:1; padding:11px 4px; border:1px solid var(--line); background:#fffdf9; border-radius:10px; cursor:pointer; font-weight:700; } .payment-options button.selected { border-color:var(--green); background:#eaf7ed; color:var(--green); } .finish { width:100%; border:0; border-radius:10px; padding:13px; background:var(--red); color:white; font-weight:800; cursor:pointer; }
    @media (max-width:850px) { main { grid-template-columns:1fr; padding:18px; } .order { min-height:400px; } header { padding:0 18px; } .shift { display:none; } }
    @media (max-width:440px) { .sale-data { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><div class="brand"><div class="mark">🌮</div><div>TACOS ROSSY<br><small style="font-size:11px;font-weight:600;letter-spacing:1.4px">SABOR QUE ENAMORA</small></div></div><div class="shift"><i class="online"></i> Caja abierta · Turno 1</div></header>
  <main>
    <section class="catalog"><div class="topline"><div><h1>¿Qué va a llevar?</h1><div class="today" id="date"></div></div><div class="today">Venta nueva</div></div>
      <div class="sale-data"><div class="field"><label for="table">Mesa</label><input id="table" type="text" placeholder="Ej. Mesa 4 / Para llevar" /></div><div class="field"><label for="cashier">Cajero(a)</label><input id="cashier" type="text" placeholder="Nombre de quien cobra" /></div></div>
      <nav class="categories"><button class="category active">Todos</button><button class="category">Tacos</button><button class="category">Gringas</button><button class="category">Bebidas</button><button class="category">Extras</button></nav>
      <div class="products" id="products"></div>
    </section>
    <aside class="order"><div class="order-head"><h2>Orden actual</h2><button class="new-order" id="clear">Limpiar</button></div><div id="cart"><div class="empty"><strong>Tu orden está vacía</strong>Selecciona productos del menú<br>para agregarlos aquí.</div></div><div class="summary"><div class="row"><span>Subtotal</span><span id="subtotal">$0.00</span></div><div class="row"><span>IVA (incluido)</span><span>$0.00</span></div><div class="row total"><span>Total</span><span id="total">$0.00</span></div><button class="pay" id="pay" disabled>Cobrar orden</button></div></aside>
  </main>
  <div class="modal" id="modal"><div class="dialog"><div class="check">✓</div><h2>Confirmar cobro</h2><p id="sale-summary">Selecciona el método de pago para completar la venta.</p><div class="payment-options"><button class="selected">💵 Efectivo</button><button>💳 Tarjeta</button><button>📱 Transferencia</button></div><button class="finish" id="finish">Cobrar <span id="modal-total"></span></button></div></div>
  <script>
    const menu=[['Taco al Pastor',22,'🌮','Tacos'],['Taco de Bistec',25,'🌮','Tacos'],['Taco de Suadero',24,'🌮','Tacos'],['Taco de Longaniza',23,'🌮','Tacos'],['Gringa al Pastor',65,'🫓','Gringas'],['Gringa de Bistec',70,'🫓','Gringas'],['Quesadilla',45,'🧀','Gringas'],['Agua de Horchata',25,'🥤','Bebidas'],['Refresco',28,'🥤','Bebidas'],['Orden de Cebollitas',30,'🧅','Extras'],['Guacamole',35,'🥑','Extras'],['Salsa extra',8,'🌶️','Extras']];
    let cart={}, filter='Todos'; const money=n=>'$'+n.toFixed(2); const products=document.querySelector('#products');
    function renderProducts(){products.innerHTML='';menu.filter(x=>filter==='Todos'||x[3]===filter).forEach(([name,price,emoji])=>{const b=document.createElement('button');b.className='product';b.innerHTML=`<div class="product-image">${emoji}</div><div class="product-info"><span class="product-name">${name}</span><div class="price">${money(price)}</div></div>`;b.onclick=()=>add(name);products.append(b)})}
    function add(name){cart[name]=(cart[name]||0)+1;renderCart()}; function change(name,n){cart[name]+=n;if(cart[name]<=0)delete cart[name];renderCart()}
    function renderCart(){const entries=Object.entries(cart), el=document.querySelector('#cart');let sum=0;if(!entries.length)el.innerHTML='<div class="empty"><strong>Tu orden está vacía</strong>Selecciona productos del menú<br>para agregarlos aquí.</div>';else{el.innerHTML='';entries.forEach(([name,qty])=>{const item=menu.find(x=>x[0]===name), amount=item[1]*qty;sum+=amount;const d=document.createElement('div');d.className='item';d.innerHTML=`<div><div class="item-name">${name}</div><div class="quantity"><button aria-label="Quitar">−</button><span>${qty}</span><button aria-label="Agregar">+</button></div></div><div class="item-price">${money(amount)}</div>`;d.querySelectorAll('button')[0].onclick=()=>change(name,-1);d.querySelectorAll('button')[1].onclick=()=>change(name,1);el.append(d)})}document.querySelector('#subtotal').textContent=money(sum);document.querySelector('#total').textContent=money(sum);document.querySelector('#pay').disabled=!sum;}
    document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{document.querySelector('.category.active').classList.remove('active');b.classList.add('active');filter=b.textContent;renderProducts()});document.querySelector('#clear').onclick=()=>{cart={};renderCart()};
    const modal=document.querySelector('#modal');document.querySelector('#pay').onclick=()=>{const table=document.querySelector('#table').value.trim()||'Para llevar';const cashier=document.querySelector('#cashier').value.trim();if(!cashier){alert('Escribe el nombre del cajero(a) para registrar la venta.');document.querySelector('#cashier').focus();return}document.querySelector('#sale-summary').textContent=`${table} · Cobra: ${cashier}`;document.querySelector('#modal-total').textContent=document.querySelector('#total').textContent;modal.classList.add('open')};document.querySelectorAll('.payment-options button').forEach(b=>b.onclick=()=>{document.querySelector('.payment-options .selected').classList.remove('selected');b.classList.add('selected')});document.querySelector('#finish').onclick=()=>{const table=document.querySelector('#table').value.trim()||'Para llevar',cashier=document.querySelector('#cashier').value.trim(),method=document.querySelector('.payment-options .selected').textContent.trim();cart={};renderCart();modal.classList.remove('open');alert(`¡Venta registrada!\n${table}\nCajero(a): ${cashier}\nPago: ${method}`);document.querySelector('#table').value=''};modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
    document.querySelector('#date').textContent=new Intl.DateTimeFormat('es-MX',{weekday:'long',day:'numeric',month:'long'}).format(new Date());renderProducts();
  </script>
</body></html>
